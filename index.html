        function initAudio() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                if (!isBgmPlaying) { startSuperFunBgm(); isBgmPlaying = true; }
            } catch (e) {}
        }

        function playSound(type) {
            try {
                initAudio();
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                if (type === 'click') {
                    osc.frequency.setValueAtTime(500, now);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now); osc.stop(now + 0.1);
                } else if (type === 'magic') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(900, now + 0.5);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                    osc.start(now); osc.stop(now + 0.6);
                } else if (type === 'win') {
                    [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.connect(g); g.connect(audioCtx.destination);
                        o.frequency.setValueAtTime(freq, now + i * 0.1);
                        g.gain.setValueAtTime(0.1, now + i * 0.1);
                        g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.3);
                        o.start(now + i * 0.1); o.stop(now + i * 0.1 + 0.3);
                    });
                } else if (type === 'error') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.setValueAtTime(140, now + 0.15);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now); osc.stop(now + 0.3);
                }
            } catch (e) {}
        }

        function startSuperFunBgm() {
            if (bgmInterval) return;
            const notes = [659.25, 783.99, 880.00, 1046.50, 880.00, 783.99, 659.25, 587.33];
            let step = 0;
            bgmInterval = setInterval(() => {
                if (!audioCtx || audioCtx.state !== 'running') return;
                try {
                    const now = audioCtx.currentTime;
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(notes[step % notes.length], now);
                    gain.gain.setValueAtTime(0.015, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(now); osc.stop(now + 0.25);
                    step++;
                } catch (e) {}
            }, 300);
        }

        function compressImage(file, callback) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const maxSize = 250;
                    let width = img.width, height = img.height;
                    if (width > height) {
                        if (width > maxSize) { height *= maxSize / width; width = maxSize; }
                    } else {
                        if (height > maxSize) { width *= maxSize / height; height = maxSize; }
                    }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', 0.8));
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function loadSupabaseData() {
            if (!supabaseClient) return;
            try {
                let oldRewardsCount = rewards ? rewards.length : 0;

                let { data: rewData } = await supabaseClient.from('rewards').select('*');

                                stock: sMap[b.id] !== undefined ? sMap[b.id] : 15,
                                active: aMap[b.id] !== undefined ? aMap[b.id] : true

                        });
                    });
                    localStorage.setItem('ncn_rewards_cache', JSON.stringify(rewards));
                    localStorage.setItem('ncn_inv_cache', JSON.stringify(branchInventories));
                }

                let { data: recData, error } = await supabaseClient.from('draw_records').select('*');
                if (!error && recData) {
                    let freshCust = {};
                    recData.forEach(r => {
                        let phone = r.phone;
                        if (!freshCust[phone]) {
                            freshCust[phone] = { drawsCount: 0, history: [] };
                        }
                        let exists = freshCust[phone].history.some(h => h.rewardName === r.reward_name && h.branchName === r.branch_name && h.id === r.id);
                        if (!exists) {
                            freshCust[phone].drawsCount += 1;
                            freshCust[phone].history.push({
                                id: r.id,
                                rewardName: r.reward_name || 'ไม่ระบุ',
                                branchName: r.branch_name,
                                time: r.time || new Date().toLocaleString('th-TH')

                    customers = freshCust;
                    localStorage.setItem('ncn_customers', JSON.stringify(customers));
                }

                if (currentView === 'admin_dashboard' && adminTab === 'stock' && rewards.length === oldRewardsCount) {
                    BRANCHES.forEach(b => {
                        rewards.forEach(r => {
                            if (document.getElementById(`stock-val-${b.id}-${r.id}`)) {

                                updateActiveDOM(b.id, r.id);
                            }

            } catch (err) {}
        }

        async function saveRewardToSupabase(rewardId) {
            localStorage.setItem('ncn_rewards_cache', JSON.stringify(rewards));
            localStorage.setItem('ncn_inv_cache', JSON.stringify(branchInventories));
            if (!supabaseClient) return;

            const reward = rewards.find(r => r.id === rewardId);
            if (!reward) return;

            let stock_map = {}, active_map = {};
            BRANCHES.forEach(b => {
                stock_map[b.id] = branchInventories[b.id]?.[rewardId]?.stock ?? 15;
                active_map[b.id] = branchInventories[b.id]?.[rewardId]?.active ?? true;
            });

            try {
                await supabaseClient.from('rewards').upsert({
                    id: reward.id, name: reward.name, image: reward.image, stock_map, active_map
                });
            } catch (err) {}
        }

        if (supabaseClient) {
            supabaseClient.channel('public:draw_records').on('postgres_changes', { event: '*', schema: 'public', table: 'draw_records' }, () => { loadSupabaseData(); }).subscribe();

        async function launchKrathong(num) {
            playSound('magic');
            
            const loader = document.getElementById(`loader-${num}`);
            if (loader) { loader.classList.remove('hidden'); loader.classList.add('flex'); }

            let supaDraws = 0;
            if (supabaseClient) {
                try {
                    let { data } = await supabaseClient.from('draw_records').select('*').eq('phone', customerPhone);
                    if (data) {
                        supaDraws = data.length;
                        customers[customerPhone] = {
                            drawsCount: supaDraws,
                            history: data.map(r => ({ id: r.id, rewardName: r.reward_name, branchName: r.branch_name, time: r.time || 'ไม่ระบุ' }))
                        };
                        localStorage.setItem('ncn_customers', JSON.stringify(customers));
                    }
                } catch(e) {}
            }

            if (loader) loader.classList.add('hidden');

            if (supaDraws >= 2) {
                let historyHTML = getCustomerHistoryHTML(customerPhone);
                showCustomAlert('ใช้สิทธิ์ครบแล้ว! 🚫', 'คุณใช้สิทธิ์ครบ 2 ครั้งแล้วครับ (ไม่สามารถสุ่มซ้ำได้)' + historyHTML, () => { goToHome(); });
                return;
            }

            let availableRewards = rewards.filter(r => {
                const inv = branchInventories[selectedBranch]?.[r.id];
                return inv && inv.active && inv.stock > 0;
            });

            if (availableRewards.length === 0) {
                showCustomAlert('ของรางวัลหมด! 📦', 'ขออภัยค่ะ ของรางวัลในสาขานี้หมดเกลี้ยงแล้ว');
                return;
            }

            let totalWeight = availableRewards.reduce((sum, r) => sum + (r.weight || 15), 0);
            let randomWeight = Math.random() * totalWeight;
            let currentSum = 0;
            let wonReward = availableRewards[0];

            for (let r of availableRewards) {
                currentSum += (r.weight || 15);
                if (randomWeight <= currentSum) {
                    wonReward = r;
                    break;
                }
            }

            const modal = document.createElement('div');
            modal.id = 'anim-modal';
            modal.className = 'fixed inset-0 bg-black/40 backdrop-blur-md z-50 flex flex-col items-center justify-center p-6 text-center';
            modal.innerHTML = `
                <div class="card-glass p-8 rounded-3xl max-w-sm w-full bg-white glow-pink">
                    <div class="text-7xl mb-4 animate-bounce">🕯️🌊</div>
                    <h3 class="text-2xl font-bold text-pink-600 mb-2">กำลังลอยกระทงลงสู่สายน้ำ...</h3>
                    <p class="text-purple-500 text-sm italic mb-6 animate-pulse">"ขอให้ผลบุญหนุนนำ โชคลาภจงบังเกิด!"</p>
                    <div class="w-12 h-12 border-4 border-pink-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
                </div>
            `;
            document.body.appendChild(modal);

            branchInventories[selectedBranch][wonReward.id].stock -= 1;
            await saveRewardToSupabase(wonReward.id);

            const branchObj = BRANCHES.find(b => b.id === selectedBranch);
            const timeStr = new Date().toLocaleString('th-TH');

            if (supabaseClient) {
                try {
                    let newDrawId = 'd_' + Date.now().toString() + Math.floor(Math.random() * 1000);
                    const { error } = await supabaseClient.from('draw_records').insert([{
                        id: newDrawId,
                        phone: customerPhone,
                        name: '-',
                        branch_name: branchObj.name,
                        reward_name: wonReward.name,
                        reward_image: (typeof wonReward.image === 'string' ? wonReward.image : ''),
                        time: timeStr
                    }]);
                    
                    if (!error) {
                        let { data } = await supabaseClient.from('draw_records').select('*').eq('phone', customerPhone);
                        if (data) {
                            customers[customerPhone] = {
                                drawsCount: data.length,
                                history: data.map(r => ({ id: r.id, rewardName: r.reward_name, branchName: r.branch_name, time: r.time || 'ไม่ระบุ' }))
                            };
                            localStorage.setItem('ncn_customers', JSON.stringify(customers));
                        }
                    }
                } catch (e) {}
            }

            setTimeout(() => {
                document.getElementById('anim-modal')?.remove();
                playSound('win');
                showWinPopup(wonReward, customers[customerPhone]?.drawsCount || 1);
            }, 2000);
        }

                                                            <div class="flex space-x-1 mb-2">
                                                                <button onclick="updateStock('${b.id}', '${r.id}', -1)" class="w-8 h-8 bg-rose-100 text-rose-600 rounded-xl text-xs font-bold hover:bg-rose-200">-1</button>
                                                                <button onclick="updateStock('${b.id}', '${r.id}', 1)" class="w-8 h-8 bg-emerald-100 text-emerald-600 rounded-xl text-xs font-bold hover:bg-emerald-200">+1</button>
                                                                <button onclick="updateStock('${b.id}', '${r.id}', 10)" class="w-8 h-8 bg-purple-100 text-purple-600 rounded-xl text-xs font-bold hover:bg-purple-200">+10</button>
                                                            </div>
                                                            <button onclick="openStockModal('${b.id}', '${r.id}')" class="w-full py-1.5 bg-pink-500 text-white rounded-xl text-xs font-bold hover:bg-pink-600 shadow-sm">ระบุจำนวน</button>
                                                        </div>
                                                    `;
                                                }).join('')}
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    ` : `
                        <div>
                            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 gap-3">
                                <h3 class="text-lg font-bold text-pink-600"><i class="fa-solid fa-users mr-2"></i> ประวัติลูกค้าและวันที่ใช้สิทธิ์ (สูงสุด 2 ครั้ง/เบอร์)</h3>
                                <div class="flex space-x-2">
                                    <button onclick="exportToExcel()" class="px-4 py-2 bg-emerald-600 text-white rounded-2xl text-xs font-bold hover:bg-emerald-700 shadow-md"><i class="fa-solid fa-file-excel mr-1"></i> เอ็กพอร์ตไฟล์ Excel</button>
                                    <button onclick="clearAllCustomerHistory()" class="px-4 py-2 bg-rose-600 text-white rounded-2xl text-xs font-bold hover:bg-rose-700 shadow-md"><i class="fa-solid fa-trash-can mr-1"></i> ล้างประวัติลูกค้าทั้งหมด</button>
                                </div>
                            </div>
                            <div class="overflow-x-auto">
                                <table class="w-full text-left text-sm text-gray-600">
                                    <thead class="bg-pink-50 text-pink-600 uppercase text-xs border-b border-pink-200">
                                        <tr>
                                            <th class="p-3 rounded-l-xl">เบอร์โทรศัพท์</th>
                                            <th class="p-3">สิทธิ์ที่ใช้ไป</th>
                                            <th class="p-3">ประวัติรางวัลและวันเวลาที่ได้รับ</th>
                                            <th class="p-3 text-center rounded-r-xl">จัดการสิทธิ์</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-pink-100">
                                        ${totalCustomers === 0 ? `
                                            <tr><td colspan="4" class="p-4 text-center text-purple-400">ยังไม่มีข้อมูลประวัติการสุ่มของลูกค้า</td></tr>
                                        ` : Object.entries(customers).map(([phone, data]) => `
                                            <tr class="hover:bg-pink-50/50">
                                                <td class="p-3 font-mono font-bold text-pink-600">${phone}</td>
                                                <td class="p-3"><span class="px-2.5 py-1 bg-pink-100 text-pink-700 rounded-full text-xs font-semibold">${data.drawsCount} / 2 ครั้ง</span></td>
                                                <td class="p-3 text-xs">
                                                    ${(data.history || []).map((h, i) => `<div class="mb-1"><b>#${i+1}</b> 🎁 ${h.rewardName} (${h.branchName}) <br><span class="text-[10px] text-purple-500"><i class="fa-solid fa-clock mr-1"></i>${h.time || 'ไม่ระบุ'}</span></div>`).join('')}
                                                </td>
                                                <td class="p-3 text-center">
                                                    <button onclick="resetCustomerRights('${phone}')" class="px-3 py-1 bg-amber-500 text-white rounded-xl text-xs font-bold hover:bg-amber-600 shadow-sm mr-1">รีเซ็ต (0)</button>
                                                    <button onclick="deleteCustomerRecord('${phone}')" class="px-3 py-1 bg-rose-500 text-white rounded-xl text-xs font-bold hover:bg-rose-600 shadow-sm">ลบ</button>
                                                </td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    `}
                </div>
            `;
        }

        function updateStockDOM(branchId, rewardId) {
            const inv = branchInventories[branchId]?.[rewardId];
            if (!inv) return;
            const spanElem = document.getElementById(`stock-val-${branchId}-${rewardId}`);
            const cardElem = document.getElementById(`card-stock-${branchId}-${rewardId}`);
            if (spanElem) {
                spanElem.textContent = inv.stock + ' ชิ้น';
                spanElem.className = inv.stock > 0 ? 'text-green-600 font-bold' : 'text-rose-600 font-bold';
            }
            if (cardElem) {
                cardElem.className = `bg-pink-50/50 p-3 rounded-2xl border ${inv.stock > 0 && inv.active ? 'border-pink-200' : 'border-rose-300'}`;
            }
        }

        function updateActiveDOM(branchId, rewardId) {
            const inv = branchInventories[branchId]?.[rewardId];
            if (!inv) return;
            const btn = document.getElementById(`btn-active-${branchId}-${rewardId}`);
            const card = document.getElementById(`card-stock-${branchId}-${rewardId}`);
            if (btn) {
                btn.textContent = inv.active ? 'เปิดสุ่ม' : 'ปิดสุ่ม';
                btn.className = `px-2 py-0.5 rounded-lg text-[10px] font-bold ${inv.active ? 'bg-emerald-500 text-white' : 'bg-rose-500 text-white'}`;
            }
            if (card) {
                card.className = `bg-pink-50/50 p-3 rounded-2xl border ${inv.stock > 0 && inv.active ? 'border-pink-200' : 'border-rose-300'}`;
            }
        }

        function openStockModal(branchId, rewardId) {
            playSound('click');
            const inv = branchInventories[branchId][rewardId];
            const branchObj = BRANCHES.find(b => b.id === branchId);
            const reward = rewards.find(r => r.id === rewardId);

            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4';
            modal.innerHTML = `
                <div class="card-glass p-6 rounded-3xl max-w-sm w-full glow-pink text-center relative bg-white">
                    <h3 class="text-lg font-bold text-pink-600 mb-1">ระบุจำนวนสต็อก</h3>
                    <p class="text-xs text-purple-500 mb-4">${reward.name} (${branchObj.name})</p>
                    <input type="number" id="popup-stock-input" value="${inv.stock}" class="w-full px-4 py-3 rounded-2xl bg-pink-50 border border-pink-200 text-gray-700 text-center text-xl font-bold mb-4 focus:outline-none focus:border-pink-500 shadow-inner">
                    <div class="flex space-x-2">
                        <button id="popup-save-btn" class="flex-1 py-2.5 bg-gradient-to-r from-pink-500 to-rose-400 text-white font-bold rounded-2xl text-sm shadow-md">บันทึก</button>
                        <button onclick="this.closest('.fixed').remove()" class="flex-1 py-2.5 bg-gray-100 text-gray-700 font-bold rounded-2xl text-sm">ยกเลิก</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            const input = modal.querySelector('#popup-stock-input');
            input.focus();
            input.select();

            modal.querySelector('#popup-save-btn').addEventListener('click', async () => {
                let val = parseInt(input.value);
                if (isNaN(val)) val = 0;
                inv.stock = Math.max(0, val);
                updateStockDOM(branchId, rewardId);
                modal.remove();
                await saveRewardToSupabase(rewardId);
            });
        }

        async function updateStock(branchId, rewardId, amount) {
            playSound('click');
            let inv = branchInventories[branchId][rewardId];
            inv.stock = Math.max(0, inv.stock + amount);
            updateStockDOM(branchId, rewardId);
            await saveRewardToSupabase(rewardId);
        }

        async function toggleBranchReward(branchId, rewardId) {
            playSound('click');
            let inv = branchInventories[branchId][rewardId];
            inv.active = !inv.active;
            updateActiveDOM(branchId, rewardId);
            await saveRewardToSupabase(rewardId);
        }

        function editRewardModal(rewardId) {
            playSound('click');
            let reward = rewards.find(r => r.id === rewardId);
            if (!reward) return;

            let tempImage = reward.image;
            const isImg = typeof reward.image === 'string' && reward.image.startsWith('data:image');

            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4';
            modal.innerHTML = `
                <div class="card-glass p-6 rounded-3xl max-w-md w-full glow-pink bg-white">
                    <h3 class="text-xl font-bold text-pink-600 mb-4"><i class="fa-solid fa-pen-to-square mr-2"></i> แก้ไขของรางวัล</h3>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-pink-600 mb-1">ชื่อของรางวัล</label>
                            <input type="text" id="modal-reward-name" value="${reward.name}" class="w-full px-4 py-2.5 rounded-2xl bg-pink-50 border border-pink-200 text-gray-700 text-sm focus:outline-none focus:border-pink-500 shadow-sm">
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-pink-600 mb-1">รูปภาพปัจจุบัน / เลือกรูปใหม่จากคอมพิวเตอร์</label>
                            <div class="flex items-center space-x-3 mb-2">
                                <div id="modal-preview" class="w-16 h-16 bg-pink-50 rounded-2xl flex items-center justify-center text-3xl overflow-hidden border border-pink-200 shadow-inner">
                                    ${isImg ? `<img src="${reward.image}" class="w-full h-full object-cover">` : reward.image}
                                </div>
                                <div class="flex-1">
                                    <input type="file" id="modal-file-input" accept="image/*" class="w-full text-xs text-purple-500 file:mr-2 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-pink-500 file:text-white hover:file:bg-pink-600 cursor-pointer">
                                </div>
                            </div>
                            <input type="text" id="modal-emoji-input" value="${!isImg ? reward.image : ''}" placeholder="หรือใส่อีโมจิ เช่น 🌸" class="w-full px-3 py-2 rounded-2xl bg-pink-50 border border-pink-200 text-gray-700 text-xs focus:outline-none focus:border-pink-500">
                        </div>

                        <div class="flex space-x-2 pt-2">
                            <button id="modal-save-btn" class="flex-1 py-2.5 bg-gradient-to-r from-pink-500 to-rose-400 text-white font-bold rounded-2xl text-sm shadow-md">บันทึกและซิงก์</button>
                            <button id="modal-cancel-btn" class="flex-1 py-2.5 bg-gray-100 text-gray-700 font-bold rounded-2xl text-sm">ยกเลิก</button>
                        </div>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            const fileInput = modal.querySelector('#modal-file-input');
            const emojiInput = modal.querySelector('#modal-emoji-input');
            const preview = modal.querySelector('#modal-preview');

            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    compressImage(file, (compressedDataUrl) => {
                        tempImage = compressedDataUrl;
                        preview.innerHTML = `<img src="${tempImage}" class="w-full h-full object-cover">`;
                        emojiInput.value = '';
                    });
                }
            });

            emojiInput.addEventListener('input', (e) => {
                if (e.target.value.trim() !== '') {
                    tempImage = e.target.value.trim();
                    preview.innerHTML = tempImage;
                    fileInput.value = '';
                }
            });

            modal.querySelector('#modal-save-btn').addEventListener('click', async () => {
                const newName = modal.querySelector('#modal-reward-name').value.trim();
                if (!newName) {
                    showCustomAlert('แจ้งเตือน', 'กรุณากรอกชื่อของรางวัล');
                    return;
                }
                reward.name = newName;
                reward.image = tempImage;
                modal.remove();
                renderCurrentView();
                await saveRewardToSupabase(reward.id);
            });

            modal.querySelector('#modal-cancel-btn').addEventListener('click', () => {
                modal.remove();
            });
        }

        function addNewRewardModal() {
            playSound('click');
            let tempImage = '🌸';

            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4';
            modal.innerHTML = `
                <div class="card-glass p-6 rounded-3xl max-w-md w-full glow-pink bg-white">
                    <h3 class="text-xl font-bold text-pink-600 mb-4"><i class="fa-solid fa-plus-circle mr-2"></i> เพิ่มของรางวัลใหม่</h3>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-pink-600 mb-1">ชื่อของรางวัล</label>
                            <input type="text" id="modal-reward-name" placeholder="เช่น กระเป๋าผ้าพรีเมียม" class="w-full px-4 py-2.5 rounded-2xl bg-pink-50 border border-pink-200 text-gray-700 text-sm focus:outline-none focus:border-pink-500 shadow-sm">
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-pink-600 mb-1">อัปโหลดรูปภาพจากคอมพิวเตอร์ หรือใส่อีโมจิ</label>
                            <div class="flex items-center space-x-3 mb-2">
                                <div id="modal-preview" class="w-16 h-16 bg-pink-50 rounded-2xl flex items-center justify-center text-3xl overflow-hidden border border-pink-200 shadow-inner">🌸</div>
                                <div class="flex-1">
                                    <input type="file" id="modal-file-input" accept="image/*" class="w-full text-xs text-purple-500 file:mr-2 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-pink-500 file:text-white hover:file:bg-pink-600 cursor-pointer">
                                </div>
                            </div>
                            <input type="text" id="modal-emoji-input" placeholder="หรือใส่อีโมจิ เช่น 🌸" class="w-full px-3 py-2 rounded-2xl bg-pink-50 border border-pink-200 text-gray-700 text-xs focus:outline-none focus:border-pink-500">
                        </div>

                        <div class="flex space-x-2 pt-2">
                            <button id="modal-save-btn" class="flex-1 py-2.5 bg-gradient-to-r from-pink-500 to-rose-400 text-white font-bold rounded-2xl text-sm shadow-md">เพิ่มของรางวัล</button>
                            <button id="modal-cancel-btn" class="flex-1 py-2.5 bg-gray-100 text-gray-700 font-bold rounded-2xl text-sm">ยกเลิก</button>
                        </div>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            const fileInput = modal.querySelector('#modal-file-input');
            const emojiInput = modal.querySelector('#modal-emoji-input');
            const preview = modal.querySelector('#modal-preview');

            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    compressImage(file, (compressedDataUrl) => {
                        tempImage = compressedDataUrl;
                        preview.innerHTML = `<img src="${tempImage}" class="w-full h-full object-cover">`;
                        emojiInput.value = '';
                    });
                }
            });

            emojiInput.addEventListener('input', (e) => {
                if (e.target.value.trim() !== '') {
                    tempImage = e.target.value.trim();
                    preview.innerHTML = tempImage;
                    fileInput.value = '';
                }
            });

            modal.querySelector('#modal-save-btn').addEventListener('click', async () => {
                const name = modal.querySelector('#modal-reward-name').value.trim();
                if (!name) {
                    showCustomAlert('แจ้งเตือน', 'กรุณากรอกชื่อของรางวัล');
                    return;
                }
                let newId = 'r_' + Date.now();
                let newReward = { id: newId, name, image: tempImage, weight: 15 };
                
                rewards.push(newReward);
                BRANCHES.forEach(b => {
                    if (!branchInventories[b.id]) branchInventories[b.id] = {};
                    branchInventories[b.id][newId] = { stock: 15, active: true };
                });

                modal.remove();
                renderCurrentView();
                await saveRewardToSupabase(newId);
            });

            modal.querySelector('#modal-cancel-btn').addEventListener('click', () => {
                modal.remove();
            });
        }

        async function deleteReward(rewardId) {
            if (confirm('⚠️ คุณแน่ใจหรือไม่ที่จะลบของรางวัลนี้ออกจากระบบ?')) {
                playSound('click');
                rewards = rewards.filter(r => r.id !== rewardId);
                localStorage.setItem('ncn_rewards_cache', JSON.stringify(rewards));
                renderCurrentView();
                if (supabaseClient) {
                    await supabaseClient.from('rewards').delete().eq('id', rewardId);
                }
            }
        }

        async function resetCustomerRights(phone) {
            if (confirm(`ต้องการรีเซ็ตสิทธิ์ของเบอร์ ${phone} ให้กลับเป็น 0 (สิทธิ์เต็ม 2 ครั้ง) หรือไม่?`)) {
                playSound('click');
                delete customers[phone];
                localStorage.setItem('ncn_customers', JSON.stringify(customers));
                if (supabaseClient) {
                    await supabaseClient.from('draw_records').delete().eq('phone', phone);
                }
                renderCurrentView();
            }
        }

        async function deleteCustomerRecord(phone) {
            if (confirm(`⚠️ ยืนยันการลบประวัติและสิทธิ์ทั้งหมดของเบอร์ ${phone}?`)) {
                playSound('click');
                delete customers[phone];
                localStorage.setItem('ncn_customers', JSON.stringify(customers));
                if (supabaseClient) {
                    await supabaseClient.from('draw_records').delete().eq('phone', phone);
                }
                renderCurrentView();
            }
        }

        async function clearAllCustomerHistory() {
            if (confirm('⚠️ คำเตือน: คุณต้องการล้างประวัติลูกค้าและข้อมูลการสิทธิ์ทั้งหมดออกจากระบบจริง ๆ หรือไม่? (ไม่สามารถกู้คืนได้)')) {
                playSound('click');
                customers = {};
                localStorage.removeItem('ncn_customers');
                if (supabaseClient) {
                    try {
                        await supabaseClient.from('draw_records').delete().neq('id', '0');
                    } catch(e) {}
                }
                renderCurrentView();
                showCustomAlert('สำเร็จ ✨', 'ล้างประวัติลูกค้าทั้งหมดเรียบร้อยแล้วครับ');
            }
        }

        function exportToExcel() {
            playSound('click');
            let csv = '\uFEFFเบอร์โทรศัพท์,ครั้งที่,ของรางวัล,สาขา,วันเวลาที่ได้รับ\n';
            Object.entries(customers).forEach(([phone, data]) => {
                (data.history || []).forEach((h, idx) => {
                    csv += `"${phone}","${idx + 1}","${h.rewardName}","${h.branchName}","${h.time || '-'}"\n`;
                });
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `NCN_LoyKrathong_Customer_History_${new Date().toISOString().slice(0,10)}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        renderCurrentView();
        loadSupabaseData();
    </script>
</body>
</html>
